<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amadeus</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #17171a; color: #e8e8ea;
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  #log { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .turn { max-width: 720px; margin: 0 auto 18px; }
  .who { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #8a8a94; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .error .text { color: #ff8a7a; }
  form { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid #2c2c32; }
  form > * { max-width: 720px; }
  #msg {
    flex: 1; margin-left: auto; padding: 11px 14px; border-radius: 8px;
    border: 1px solid #3a3a42; background: #1f1f24; color: inherit; font: inherit;
  }
  #msg:focus { outline: none; border-color: #6b6bff; }
  button {
    margin-right: auto; padding: 0 18px; border: 0; border-radius: 8px;
    background: #5b5bf0; color: #fff; font: inherit; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <div id="log"></div>
  <form id="form">
    <input id="msg" placeholder="Message Amadeus…" autocomplete="off" autofocus>
    <button id="send">Send</button>
  </form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const msg = document.getElementById("msg");
const send = document.getElementById("send");

// Returns the .text node so a pending turn can be filled in once the reply lands.
function addTurn(who, text, isError) {
  const turn = document.createElement("div");
  turn.className = isError ? "turn error" : "turn";
  turn.innerHTML = '<div class="who"></div><div class="text"></div>';
  turn.querySelector(".who").textContent = who;
  const body = turn.querySelector(".text");
  body.textContent = text;
  log.append(turn);
  log.scrollTop = log.scrollHeight;
  return body;
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const text = msg.value.trim();
  if (!text) return;

  msg.value = "";
  send.disabled = true;
  addTurn("You", text);
  const pending = addTurn("Amadeus", "…");

  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    if (!r.ok) throw new Error(`server returned ${r.status}`);
    pending.textContent = (await r.json()).response;
  } catch (err) {
    pending.parentElement.className = "turn error";
    pending.textContent = String(err);
  } finally {
    send.disabled = false;
    msg.focus();
    log.scrollTop = log.scrollHeight;
  }
};
</script>
</body>
</html>
